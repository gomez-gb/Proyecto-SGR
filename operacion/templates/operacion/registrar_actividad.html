{% extends "operacion/base.html" %}
{% block titulo %}Registrar actividad{% endblock %}
{% block contenido %}
<h1 class="h4 mb-3">Registrar actividad</h1>
<form method="post" novalidate>
    {% csrf_token %}
    <fieldset class="mb-4">
        <legend class="h6">Actividad</legend>
        {% for field in actividad_form %}
        <div class="mb-3">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
            <div class="text-danger small">{{ error }}</div>
            {% endfor %}
        </div>
        {% endfor %}
    </fieldset>
    <button class="btn btn-primary" type="submit">Registrar y continuar a evidencia</button>
</form>
{% endblock %}
