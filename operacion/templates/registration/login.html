<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingreso — SGR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container" style="max-width: 400px; margin-top: 10vh;">
    <h1 class="h4 mb-3">Ingresar al SGR</h1>
    {% if form.errors %}
    <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="id_username">Usuario</label>
            <input class="form-control" type="text" name="username" id="id_username" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label" for="id_password">Contraseña</label>
            <input class="form-control" type="password" name="password" id="id_password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
    </form>
</div>
</body>
</html>
